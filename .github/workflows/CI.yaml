name: CI workflow

on:
  push:
    branches:
      - main

jobs:
    CI:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v7 
            - run: dir

            - uses: actions/setup-node@v7
              with:
                node-version: '26'

            - run: npm ci
            - run: npm run test
            - run: npm run run
            - run: npm run build